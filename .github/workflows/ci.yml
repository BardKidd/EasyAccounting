name: CI Pipeline

on:
  push:
    branches: ['main', 'product']
  pull_request:
    branches: ['main', 'product']

# 同一 ref 有新 push 時，取消還在跑的舊 CI，省 runner 分鐘數
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.14.1'

jobs:
  # ── 靜態品質關口：lint + 型別檢查 + build（不需要 DB，最快回饋）─────────
  quality:
    name: Lint / Types / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Next.js build 需要此 public 變數；CI 只驗證能否 build，給假值即可
      NEXT_PUBLIC_API_DOMAIN: https://ci.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

      - name: Build
        run: pnpm build

  # ── 後端測試（需要 PostgreSQL service）──────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_USER: test_user
      PG_HOST: localhost
      PG_DATABASE: test_db
      PG_PASSWORD: test_password
      PG_PORT: 5432
      NODE_ENV: test
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      JWT_SECRET: test_secret_key
      RESEND_API_KEY: re_123
      AZURE_STORAGE_CONTAINER_NAME: test_container
      AZURE_BLOB_CONNECTION_STRING: 'DefaultEndpointsProtocol=https;AccountName=test;AccountKey=test;EndpointSuffix=core.windows.net'
      TEST_USER_EMAIL: test_user@example.com
      TEST_USER_PASSWORD: test_password

    services:
      postgres:
        image: postgres:17
        # 給 Postgres Image 看的變數名稱
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # 等待資料庫準備好的設定
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Create schema 'accounting' <- 雖然 migration 裡面有建立 schema，不過 Sequelize 要執行任何 Storage 操作之前，必須先建立 schema
      - name: Create schema 'accounting'
        env:
          PGPASSWORD: ${{ env.PG_PASSWORD }}
        run: |
          psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" -c "CREATE SCHEMA IF NOT EXISTS accounting;"

      - name: Database Migration & Seed
        working-directory: apps/backend
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed:undo:all
          npx sequelize-cli db:seed:all

      - name: Run Backend Tests
        run: pnpm --filter backend run test:run

  # ── 前端單元測試（jsdom，不需 DB）──────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        run: pnpm --filter frontend run test:run
