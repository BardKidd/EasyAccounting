name: Deploy Backend

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]
    branches: ['main', 'product']

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bardkidd/easy-accounting-backend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只在「push 觸發的 CI 全綠」時才部署：
    #  - conclusion == success：CI 全部 job 通過
    #  - event == push：排除 pull_request 觸發的 CI（避免用 PR 程式碼部署）
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    # 對應 GitHub Environment，可在 repo 設定加 required reviewers 保護 production
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'product' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    steps:
      # ⚠️ 關鍵：workflow_run 事件預設 checkout「預設分支(main) HEAD」，
      # github.sha 也是 main HEAD。必須明確指定觸發 CI 的那個 commit，
      # 否則部署 product 時會誤把 main 的程式碼上到 production。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set environment variables
        id: vars
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$BRANCH" = "product" ]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
            echo "app_name=easy-accounting-container-prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "app_name=easy-accounting-container-dev-jp" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          # 用 head_sha（觸發 CI 的實際 commit）當不可變 tag，dev/prod 為浮動 tag
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy to Azure Container Apps
      # ghcr package 為 public → 讓 ACA 匿名拉取，不在 app 設定存任何 registry 憑證。
      #
      # 舊做法把 ephemeral GITHUB_TOKEN 當 registryPassword 存進 app 設定：deploy 當下有效，
      # 但 token 在 job 結束後失效。之後任何「重啟 / 擴縮 / 改 env」建立新 revision 時，ACA
      # 會拿那組死 token 去 ghcr 認證（不是匿名）→ 401 → ImagePullBackOff → ingress 502。
      #
      # 修法：deploy 前先移除殘留的 ghcr 憑證，再用 az 直接更新 image（無憑證 → 匿名拉 public image）。
      # 每次 deploy 都會 idempotent 清一次，確保 app 設定永遠不留死憑證。
      - name: Deploy image (public ghcr, anonymous pull)
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp registry remove \
            --name "$APP_NAME" \
            --resource-group EasyAccounting \
            --server ghcr.io --yes || true
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group EasyAccounting \
            --image "$IMAGE"
